<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jenkins Diner</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcf8f2; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #d9534f; text-align: center; border-bottom: 2px solid #f0ad4e; padding-bottom: 10px; }
        .menu-item { display: flex; justify-content: space-between; margin: 15px 0; font-size: 1.1rem; padding: 5px 0; border-bottom: 1px dashed #ddd; }
        .price { font-weight: bold; color: #5cb85c; }
        footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to The Jenkins Diner 🍔</h1>
        <div class="menu-item"><span>DevOps Double Cheeseburger</span><span class="price">$8.99</span></div>
        <div class="menu-item"><span>Continuous Integration Fries</span><span class="price">$3.49</span></div>
        <div class="menu-item"><span>Pipeline Vanilla Shake</span><span class="price">$4.25</span></div>
        <div class="menu-item"><span>Automation Apple Pie</span><span class="price">$5.00</span></div>
        <footer>Built automatically by Jenkins Pipeline</footer>
    </div>
</body>
</html>
